name: "Hermes Assistant (fork: +HA config/addons access)"
version: "1.10.1"
slug: hermes_assistant
description: "[FORK of nuttaruj/hermes-homeassistant] Hermes AI Agent (NousResearch) with the gateway Webapp and independent recovery terminal. This fork additionally maps the real HA /config and /addons folders into the container."
url: https://github.com/laloraj/hermes-homeassistant

arch:
  - amd64
  - aarch64

# Pre-built multi-arch images published from CI to GHCR. {arch} is
# substituted by HA Supervisor. If the image is unreachable (e.g. first
# install before the package was set public), Supervisor falls back to
# building locally from Dockerfile + build.yaml — slower but never fails.
image: ghcr.io/laloraj/{arch}-hermes-assistant

startup: services
boot: auto
init: false

# HA Ingress: embeds the gateway Webapp into the HA sidebar.
ingress: true
ingress_port: 8787
panel_title: Hermes Agent
panel_icon: mdi:brain
panel_admin: true

# Auto-inject SUPERVISOR_TOKEN so Hermes can call HA without a user-managed LLA.
homeassistant_api: true
hassio_api: true
hassio_role: manager

# Gateway/Webapp HTTP + bundle readiness, not nginx liveness. A finite 15-minute
# initial boot/update grace permits first builds. Enable the separate Watchdog
# switch in Settings -> Add-ons -> Hermes Assistant; it defaults off.
watchdog: "http://[HOST]:[PORT:8787]/health"

# Persistent state lives in /data/hermes (managed by Supervisor).
# /config is the addon's user-editable config dir (claude_credentials.json etc.).
map:
  - addon_config:rw
  - share:rw
  - homeassistant_config:rw
  - addons:rw

# Skip regenerable artifacts from HA backups (~400-600MB saved).
# Agent code mirror lives in /data so updates persist, but the
# venv directories can be rebuilt from the image seed if lost.
backup_exclude:
  - "hermes/agent-code/venv/*"
  - "hermes/agent-code/node_modules/*"
  - "hermes/agent-code/.uv-cache/*"
  - "hermes/webui-app/.venv/*"
  - "hermes/webui-app/__pycache__/*"
  - "hermes/webui/cache/*"
  - "hermes/.cache/*"

# Webapp + setup terminal both served via HA Ingress (multiplexed through
# nginx inside the container). Neither is exposed to the LAN. The optional
# LAN port mapping is removed — terminal is reachable only via the Ingress
# panel at <ingress_url>/terminal/.

options:
  # ── COMMON ──────────────────────────────────────────────────────────────
  timezone: "Asia/Bangkok"
  enable_terminal: true

  # ── UPGRADES ────────────────────────────────────────────────────────────
  # When true, update Hermes ONCE on the next start (snapshot, update, health
  # check, automatic rollback), then this switches itself back off. Your
  # memory, wiki, scripts and settings are kept. Or ask the agent to update.
  auto_update_agent: false

  # ── INTEGRATIONS ────────────────────────────────────────────────────────
  # When true, register HA Core's MCP Server as a Hermes MCP source
  # automatically (re-rendered on every boot). Requires the "MCP Server"
  # integration enabled in HA: Settings → Devices & Services → Add
  # Integration → "Model Context Protocol".
  auto_configure_mcp: true

  # ── OPTIONAL ────────────────────────────────────────────────────────────
  # Override the auto-injected SUPERVISOR_TOKEN with your own Long-Lived
  # Access Token. Leave empty to use the supervisor proxy (recommended).
  homeassistant_token: ""

  # ── BITWARDEN (password manager for logins Hermes needs) ───────────────
  # Fill in email + master password and the add-on sets up the Bitwarden CLI by
  # itself on every start. Server: leave empty to auto-use the Vaultwarden
  # add-on on this Home Assistant; otherwise enter a host name or URL.
  bitwarden_server: ""
  bitwarden_email: ""
  bitwarden_master_password: ""
  # Only if your account uses two-step login: personal API key (web vault ->
  # Settings -> Security -> Keys). Still needs the master password above.
  bitwarden_client_id: ""
  bitwarden_client_secret: ""

  # Entities for Hermes to watch. Empty = none.
  watch_entities: []

schema:
  timezone: str
  enable_terminal: bool
  auto_update_agent: bool
  auto_configure_mcp: bool
  homeassistant_token: password?
  bitwarden_server: str?
  bitwarden_email: str?
  bitwarden_master_password: password?
  bitwarden_client_id: str?
  bitwarden_client_secret: password?
  watch_entities:
    - str?
