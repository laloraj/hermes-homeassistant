# Add-on wrapper only. Hermes itself supplies the sole chat/settings UI.
# HA admin Ingress is the gate; no ports are published to the LAN.
# Root workers are required by Hermes' same-user one-use ticket redemption.
user root;
worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid recording one-use links or user-supplied query strings.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;
    gzip off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 0.0.0.0:8787 default_server;
        server_name _;
        absolute_redirect off;  # HA ingress must not receive container-host redirects.
        location = /health {
            proxy_pass http://127.0.0.1:9130;
            proxy_connect_timeout 2;
            proxy_read_timeout 9;
        }
        location = /ready {
            proxy_pass http://127.0.0.1:9130;
            proxy_connect_timeout 2;
            proxy_read_timeout 9;
        }
        location = / {
            proxy_pass http://127.0.0.1:9130;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_read_timeout 45;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = /recovery/;
        }
        # Served directly by nginx: works without Python, gateway, provider or bundle.
        location = /recovery { return 302 $http_x_ingress_path/recovery/; }
        location = /recovery/ {
            default_type text/html;
            add_header Cache-Control no-store always;
            return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hermes add-on recovery</title><h1>Hermes add-on recovery</h1><p>This is the add-on wrapper, not a second Hermes UI.</p><p><a href="$http_x_ingress_path/">Retry Webapp</a> | <a href="$http_x_ingress_path/terminal/">Setup / recovery terminal</a></p><h2>Logs</h2><p><a href="$http_x_ingress_path/logs/bootstrap.log">Bootstrap / runtime</a> | <a href="$http_x_ingress_path/logs/gateway-addon.log">Gateway</a> | <a href="$http_x_ingress_path/logs/webapp-build.log">Webapp build</a> | <a href="$http_x_ingress_path/logs/safe-update.log">Safe update</a> | <a href="$http_x_ingress_path/logs/webapp-ticket.log">Front door</a></p><h2>Rollback</h2><p>In the terminal run <code>hermes-safe-update.sh --rollback</code>. This restores the latest pre-update snapshot. Stop other CLI writers first. To update safely run <code>hermes-safe-update.sh --now</code>.</p><p>If the terminal is disabled, enable <code>enable_terminal</code> in add-on Configuration and restart. If nginx itself is down, use the Home Assistant add-on Logs and restore an HA backup.</p>';
        }
        # Fixed allowlist only: never expose config, auth, secrets, or arbitrary paths.
        location ~ ^/logs/(bootstrap|gateway-addon|webapp-build|safe-update|webapp-ticket)\.log$ {
            alias /data/hermes/logs/$1.log;
            default_type text/plain;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
        }
        location /logs/ { return 404; }
        location = /terminal { return 302 $http_x_ingress_path/terminal/; }
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_once off;
            sub_filter_types application/javascript application/json text/javascript;
            sub_filter 'src="/terminal/' 'src="$http_x_ingress_path/terminal/';
            sub_filter 'href="/terminal/' 'href="$http_x_ingress_path/terminal/';
            sub_filter '"/terminal/' '"$http_x_ingress_path/terminal/';
        }
        location /webapp/ {
            proxy_pass http://127.0.0.1:9120/;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:9120;
            proxy_set_header Origin http://127.0.0.1:9120;
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path/webapp;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_intercept_errors on;
            error_page 502 504 = /recovery/;
        }
        # Retired bookmarks do not resurrect classic routes or expose stored chats.
        location / { return 302 $http_x_ingress_path/recovery/; }
    }
}
