# Hermes Assistant — nginx multiplex behind HA Ingress
#
# Routes both the Web UI and the ttyd setup terminal through the single
# ingress_port (8787) so users see one panel in the HA sidebar but can
# switch between webui and terminal via in-page navigation.
#
#   /            → front door (127.0.0.1:9130): signs you in to the Webapp, falls back to /old/
#   /webapp/     → Hermes Webapp (127.0.0.1:9120, served by the gateway)
#   /old/        → classic WebUI (127.0.0.1:8788)
#   /terminal/   → ttyd   (127.0.0.1:7681 with --base-path /terminal/)
#   anything else → classic WebUI (keeps old bookmarks working)
#
# ttyd generates HTML with absolute paths like '/terminal/inject.js'.
# When the page is served inside the HA Ingress iframe at
# 'https://ha/api/hassio_ingress/<token>/terminal/', the browser resolves
# '/terminal/inject.js' against the HA host root — NOT the Ingress prefix —
# so the asset 404s. The sub_filter rewrites those paths to include the
# X-Ingress-Path header value (set by Supervisor) so the browser resolves
# them through the Ingress proxy and back to nginx.

# Workers run as root: the Webapp only lets a connection owned by the Hermes user (root here) spend a
# sign-in ticket, and nginx is the connection it sees. The add-on publishes no ports; HA Ingress is the gate.
user root;
worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout combined;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # sub_filter cannot rewrite gzipped response bodies.
    gzip off;

    # WebSocket upgrade map (used by both webui and ttyd).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 0.0.0.0:8787 default_server;
        server_name _;

        # ── Setup terminal: ttyd ────────────────────────────────────────
        # Prefix-preserving proxy (no trailing slash on proxy_pass) so ttyd
        # sees its --base-path intact.
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;

            # Strip iframe-blocking headers (same reason as / location)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;

            # Rewrite ttyd's absolute paths to include the HA Ingress prefix.
            # X-Ingress-Path header is sent by Supervisor for ingress requests
            # and is empty for direct (non-ingress) probes — harmless either way.
            sub_filter_once off;
            sub_filter_types text/html application/javascript application/json text/javascript;
            sub_filter 'src="/terminal/' 'src="$http_x_ingress_path/terminal/';
            sub_filter 'href="/terminal/' 'href="$http_x_ingress_path/terminal/';
            sub_filter '"/terminal/' '"$http_x_ingress_path/terminal/';
        }

        # ── Front door: sign in to the Webapp (HA Ingress is the gate) ───
        location = / {
            proxy_pass http://127.0.0.1:9130;
            proxy_set_header Host            $http_host;
            proxy_set_header X-Ingress-Path  $http_x_ingress_path;
            proxy_read_timeout 90;
        }

        # ── Hermes Webapp (browser build of Hermes Desktop) ──────────────
        # The Webapp enforces same-origin on its sign-in exchange and a bound Host, so Host/Origin are presented
        # as its own loopback address; X-Forwarded-Prefix tells it where it lives under the Ingress path.
        location /webapp/ {
            proxy_pass http://127.0.0.1:9120/;
            proxy_http_version 1.1;
            proxy_set_header Host               127.0.0.1:9120;
            proxy_set_header Origin             http://127.0.0.1:9120;
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path/webapp;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            # HA's sandboxed iframe needs these stripped (the Webapp sends frame-ancestors 'none').
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ── Classic WebUI, kept as a fallback ────────────────────────────
        location = /old {
            return 302 $http_x_ingress_path/old/;
        }
        location /old/ {
            proxy_pass http://127.0.0.1:8788/;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path/old;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # ── Web UI (everything else) ────────────────────────────────────────────
        # Webui already uses relative paths so it works through Ingress
        # without rewriting. We inject a small floating button into HTML
        # responses so users can hop to the terminal without typing a URL.
        #
        # CRITICAL: HA wraps the addon panel iframe with sandbox="" (most
        # restrictive — gives the iframe a NULL ORIGIN). webui responds
        # with `X-Frame-Options: SAMEORIGIN`, which then fails the browser
        # check (null != http://192.168.10.10:8123) and shows
        # "refused to connect". We strip the header so HA's sandbox can
        # embed the panel. Same for CSP frame-ancestors / X-Content-Type-
        # Options for safety.
        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;

            # Strip headers that block HA Ingress' sandboxed iframe
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;

        }
    }
}
