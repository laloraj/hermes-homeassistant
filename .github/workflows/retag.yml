name: Retag upstream image

on:
  push:
    branches: [main]
    paths:
      - "hermes_assistant/config.yaml"
      - "hermes_assistant/run.sh"
      - "hermes_assistant/hermes-safe-update.sh"
      - "hermes_assistant/webapp-ticket.py"
      - "hermes_assistant/bw-setup.sh"
      - "hermes_assistant/bw-shim.sh"
      - "hermes_assistant/bw-wrapper.sh"
      - "hermes_assistant/bw-session.sh"
      - "hermes_assistant/nginx.conf"
      - ".github/workflows/retag.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Upstream image tag to reuse (must exist in ghcr.io/nuttaruj).
  UPSTREAM_TAG: "1.6.8"

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build patched image (upstream + button removal)
        run: |
          VERSION=$(yq eval '.version' hermes_assistant/config.yaml)
          cat > Dockerfile.patch <<EOF
          FROM ghcr.io/nuttaruj/\${TARGETARCH_NAME}-hermes-assistant:${UPSTREAM_TAG}
          EOF
          for pair in amd64:linux/amd64 aarch64:linux/arm64; do
            arch=${pair%%:*}; plat=${pair##*:}
            printf 'FROM ghcr.io/nuttaruj/%s-hermes-assistant:%s\nCOPY nginx.conf /etc/nginx/nginx.conf\nCOPY run.sh /run.sh\nCOPY hermes-safe-update.sh /usr/local/bin/hermes-safe-update.sh\nCOPY webapp-ticket.py /usr/local/bin/webapp-ticket.py\nCOPY bw-setup.sh /usr/local/bin/bw-setup.sh\nCOPY bw-shim.sh /usr/local/bin/bw-shim.sh\nCOPY bw-wrapper.sh /usr/local/bin/bw\nCOPY bw-session.sh /usr/local/bin/bw-session\nRUN env PATH=/opt/hermes-agent/node/bin:/usr/local/bin:/usr/bin:/bin npm install --prefix /opt/bw @bitwarden/cli && chmod +x /usr/local/bin/bw-shim.sh /usr/local/bin/bw-setup.sh /usr/local/bin/bw /usr/local/bin/bw-session\nRUN chmod +x /usr/local/bin/hermes-safe-update.sh /usr/local/bin/webapp-ticket.py\nRUN chmod +x /run.sh\n' "$arch" "$UPSTREAM_TAG" > Dockerfile.patch
            docker buildx build --platform $plat -f Dockerfile.patch hermes_assistant \
              -t ghcr.io/laloraj/${arch}-hermes-assistant:${VERSION} \
              -t ghcr.io/laloraj/${arch}-hermes-assistant:latest --push
          done
