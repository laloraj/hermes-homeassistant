name: Retag upstream image

on:
  push:
    branches: [main]
    paths:
      - "hermes_assistant/config.yaml"
      - ".github/workflows/retag.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Upstream image tag to reuse (must exist in ghcr.io/nuttaruj).
  UPSTREAM_TAG: "1.6.8"

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build patched image (upstream + button removal)
        run: |
          VERSION=$(yq eval '.version' hermes_assistant/config.yaml)
          cat > Dockerfile.patch <<EOF
          FROM ghcr.io/nuttaruj/\${TARGETARCH_NAME}-hermes-assistant:${UPSTREAM_TAG}
          EOF
          for pair in amd64:linux/amd64 aarch64:linux/arm64; do
            arch=${pair%%:*}; plat=${pair##*:}
            printf 'FROM ghcr.io/nuttaruj/%s-hermes-assistant:%s\nCOPY nginx.conf /etc/nginx/nginx.conf\n' "$arch" "$UPSTREAM_TAG" > Dockerfile.patch
            docker buildx build --platform $plat -f Dockerfile.patch hermes_assistant \
              -t ghcr.io/laloraj/${arch}-hermes-assistant:${VERSION} \
              -t ghcr.io/laloraj/${arch}-hermes-assistant:latest --push
          done
